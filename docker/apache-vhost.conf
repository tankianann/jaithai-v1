<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        <Files "jt-config.php">
            Require all denied
        </Files>
    </Directory>

    <Directory /var/www/html/application/cache>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/application/logs>
        AllowOverride None
        Require all denied
    </Directory>

    Alias /__health /var/www/health/index.html

    <Directory /var/www/health>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
